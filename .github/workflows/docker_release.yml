name: Docker Build & Publish

on:
  pull_request:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Authenticate to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Set image tag and version from Git reference
      - name: Set image and version tags
        id: vars
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/dswx-swot"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF##*/}"
            VERSION_TAG="${VERSION_TAG#v}"  # Strip leading 'v'
            echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV
          else
            echo "VERSION_TAG=" >> $GITHUB_ENV
            echo "Not a version tag push. Skipping publish."
          fi

      # Build Docker image if it's a version tag push
      - name: Build Docker image
        if: env.VERSION_TAG != ''
        run: |
          docker build --network=host \
            --tag "${{ env.IMAGE_TAG }}:${{ env.VERSION_TAG }}" \
            --file=docker/Dockerfile .

      # Smoke test the Docker image
      - name: Run smoke test
        if: env.VERSION_TAG != ''
        run: |
          docker run --rm "${{ env.IMAGE_TAG }}:${{ env.VERSION_TAG }}" dswx-swot run --help

      # Push image to GitHub Container Registry
      - name: Push Docker image to GHCR
        if: env.VERSION_TAG != ''
        run: |
          docker push "${{ env.IMAGE_TAG }}:${{ env.VERSION_TAG }}"

      # Save image as tarball
      - name: Save Docker image to tarball
        if: env.VERSION_TAG != ''
        run: |
          TAR_NAME="docker-image-${{ env.VERSION_TAG }}.tar"
          docker save "${{ env.IMAGE_TAG }}:${{ env.VERSION_TAG }}" > "$TAR_NAME"
          echo "TAR_NAME=${TAR_NAME}" >> $GITHUB_ENV

      # Upload tarball as a workflow artifact
      - name: Upload image tarball
        if: env.VERSION_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAR_NAME }}
          path: ${{ env.TAR_NAME }}

      # Output image usage instructions
      - name: Print Docker usage info
        if: env.VERSION_TAG != ''
        run: |
          echo "✅ Docker image published to GHCR!"
          echo ""
          echo "To pull the image:"
          echo "docker pull ${{ env.IMAGE_TAG }}:${{ env.VERSION_TAG }}"
          echo ""
          echo "🗃️  Tarball available as workflow artifact: ${{ env.TAR_NAME }}"
